<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Success - Shrivastra</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .success-box {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .success-box h2 {
      color: #28a745;
      margin-bottom: 15px;
    }
    .success-box p {
      margin: 8px 0;
      color: #333;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      text-decoration: none;
    }
    .btn:hover {
      background: #218838;
    }
  </style>
</head>
<body>

  <div class="success-box">
    <h2>🎉 Order Confirmed!</h2>
    <p>Thank you, <strong>{{ name }}</strong> ❤️</p>
    <p>Your order total is <strong>₹{{ total }}</strong></p>
    <p>You can track your order status anytime in <b>My Orders</b>.</p>

    <a href="{{ url_for('order_status') }}" class="btn">Track My Order</a>
  </div>

</body>
</html>
