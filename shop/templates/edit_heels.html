<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Heels</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <!-- Reuse your existing edit form styling from edit_shoes.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='edit_shoes.css') }}">
</head>
<body>
    <header>
        <h1>Edit Heels Item</h1>
    </header>

    <main>
        <form action="/edit_heels/{{ item.id }}" method="post" class="edit-form">
            <input type="text" name="name" value="{{ item.name }}" placeholder="Heels Name" required>
            <textarea name="description" rows="4" placeholder="Description">{{ item.description }}</textarea>
            <input type="number" step="0.01" name="price" value="{{ item.price }}" placeholder="Price" required>
            <input type="text" name="image_url" value="{{ item.image_url }}" placeholder="Image URL">
            <button type="submit">Update</button>
        </form>
    </main>
</body>
</html>
