<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Jackets Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Admin - Jackets Dashboard</h1>
        <nav>
            <a href="/admin_home">Dashboard Home</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <!-- Add New Jacket -->
    <section class="add-form">
        <h2>Add New Jacket</h2>
        <form action="/add_jacket" method="post">
            <input type="text" name="name" placeholder="Jacket Name" required>
            <textarea name="description" placeholder="Description" rows="4"></textarea>
            <input type="number" step="0.01" name="price" placeholder="Price" required>
            <input type="text" name="image_url" placeholder="Image URL">
            <button type="submit">Add</button>
        </form>
    </section>

    <!-- Manage Jackets -->
    <main class="items-container">
        {% for jacket in jackets %}
        <div class="item-card">
            <img src="{{ jacket.image_url }}" alt="{{ jacket.name }}">
            <h2>{{ jacket.name }}</h2>
            <p>{{ jacket.description }}</p>
            <p><strong>₹{{ jacket.price }}</strong></p>
            <a href="/edit_jacket/{{ jacket.id }}" class="btn">Edit</a>
            <a href="/delete_jacket/{{ jacket.id }}" class="btn delete">Delete</a>
        </div>
        {% endfor %}
    </main>
</body>
</html>
