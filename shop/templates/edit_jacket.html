<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Jacket</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='edit_shoes.css') }}">
</head>
<body>
  <div class="form-container">
    <h2>Edit Jacket</h2>
    <form action="{{ url_for('edit_jacket', id=jacket.id) }}" method="POST">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" value="{{ jacket.name }}" required>

      <label for="description">Description:</label>
      <textarea id="description" name="description" required>{{ jacket.description }}</textarea>

      <label for="price">Price:</label>
      <input type="number" step="0.01" id="price" name="price" value="{{ jacket.price }}" required>

      <label for="image_url">Image URL:</label>
      <input type="text" id="image_url" name="image_url" value="{{ jacket.image_url }}" required>

      <button type="submit" class="btn-submit">Update Jacket</button>
    </form>
  </div>
</body>
</html>
