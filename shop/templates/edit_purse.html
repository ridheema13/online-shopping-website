<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Purse</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fff6fa;
      padding: 40px;
      color: #333;
    }

    h2 {
      color: #d63384;
    }

    form {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      background-color: #d63384;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #c2186a;
    }
  </style>
</head>
<body>
  <h2>Edit Purse Details</h2>
  <form method="POST">
    <label for="name">Name:</label>
    <input type="text" name="name" value="{{ purse.name }}" required>

    <label for="description">Description:</label>
    <input type="text" name="description" value="{{ purse.description }}" required>

    <label for="price">Price:</label>
    <input type="number" name="price" value="{{ purse.price }}" required>

    <label for="image_url">Image URL:</label>
    <input type="text" name="image_url" value="{{ purse.image_url }}" required>

    <button type="submit">Update Purse</button>
  </form>
</body>
</html>
