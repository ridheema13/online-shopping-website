<!-- templates/admin_skirtdashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Skirt Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style3.css') }}">
</head>
<body>
  <h2>Manage Skirt Collection 👗</h2>

  <!-- Add Skirt Form -->
  <form action="/add_skirt" method="post">
    <input type="text" name="name" placeholder="Skirt Name" required>
    <input type="text" name="description" placeholder="Description" required>
    <input type="number" name="price" placeholder="Price (₹)" required>
    <input type="text" name="image_url" placeholder="Image URL" required>
    <button type="submit">Add Skirt</button>
  </form>

  <!-- Skirt Items List -->
  <div class="collection-container">
    {% for item in skirts %}
      <div class="product-card">
        <img src="{{ item.image_url }}" alt="{{ item.name }}">
        <h3>{{ item.name }}</h3>
        <p>{{ item.description }}</p>
        <p><strong>₹{{ item.price }}</strong></p>
        <a href="/edit_skirt/{{ item.id }}"><button>Edit</button></a>
        <a href="/delete_skirt/{{ item.id }}" onclick="return confirm('Are you sure?');"><button>Delete</button></a>
      </div>
    {% else %}
      <p>No skirts in database yet!</p>
    {% endfor %}
  </div>
</body>
</html>
