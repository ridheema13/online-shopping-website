<!-- templates/jeans_collection.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jeans Collection</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style3.css') }}">

</head>
<body>
  <h2>Shop Our Trendy Jeans 👖</h2>
  <div class="collection-container">
    {% for item in items %}
      <div class="product-card">
        <img src="{{ item.image_url }}" alt="{{ item.name }}">
        <h3>{{ item.name }}</h3>
        <p>{{ item.description }}</p>
        <p><strong>₹{{ item.price }}</strong></p>
        <form method="POST" action="{{ url_for('add_to_cart') }}">
    <input type="hidden" name="id" value="{{ item.id }}">
    <input type="hidden" name="name" value="{{ item.name }}">
    <input type="hidden" name="price" value="{{ item.price }}">
    <input type="hidden" name="image_url" value="{{ item.image_url }}">
    
    <button type="submit"  href="{{ url_for('add_to_cart', category='dresses', item_id=item.id) }}">Add to Cart</button>
</form>

        
      </div>
    {% else %}
      <p>No items found!</p>
    {% endfor %}
  </div>
</body>
</html>
