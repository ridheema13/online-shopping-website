<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Shoes Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Admin - Shoes Dashboard</h1>
        <nav>
            <a href="/admin">Dashboard Home</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <section class="add-form">
        <h2>Add New Shoes</h2>
        <form action="/add_shoes" method="post">
            <input type="text" name="name" placeholder="Shoe Name" required>
            <textarea name="description" placeholder="Description"></textarea>
            <input type="number" name="price" placeholder="Price" required>
            <input type="text" name="image_url" placeholder="Image URL">
            <button type="submit">Add</button>
        </form>
    </section>

    <main class="items-container">
        
        {% for shoe in shoes %}
        <div class="item-card">
            <img src="{{ shoe.image_url }}" alt="{{ shoe.name }}">
            <h2>{{ shoe.name }}</h2>
            <p>{{ shoe.description }}</p>
            <p><strong>₹{{ shoe.price }}</strong></p>
            <a href="/edit_shoes/{{ shoe.id }}" class="btn">Edit</a>
            <a href="/delete_shoes/{{ shoe.id }}" class="btn delete">Delete</a>
        </div>
        {% endfor %}
    </main>
</body>
</html>
