<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Heels Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Admin - Heels Dashboard</h1>
        <nav>
            <a href="/admin_home">Dashboard Home</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <!-- Add New Heels -->
    <section class="add-form">
        <h2>Add New Heels</h2>
        <form action="/add_heels" method="post">
            <input type="text" name="name" placeholder="Heels Name" required>
            <textarea name="description" placeholder="Description" rows="4"></textarea>
            <input type="number" step="0.01" name="price" placeholder="Price" required>
            <input type="text" name="image_url" placeholder="Image URL">
            <button type="submit">Add</button>
        </form>
    </section>

    <!-- Manage Heels -->
    <main class="items-container">
        {% for heel in heels %}
        <div class="item-card">
            <img src="{{ heel.image_url }}" alt="{{ heel.name }}">
            <h2>{{ heel.name }}</h2>
            <p>{{ heel.description }}</p>
            <p><strong>₹{{ heel.price }}</strong></p>
            <a href="/edit_heels/{{ heel.id }}" class="btn">Edit</a>
            <a href="/delete_heels/{{ heel.id }}" class="btn delete">Delete</a>
        </div>
        {% endfor %}
    </main>
</body>
</html>
